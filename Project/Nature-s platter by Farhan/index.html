<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <!-- Nav-Bar starts -->
        <nav class="grid grid-cols-3 gap-4 w-10/12 mx-auto pt-3">
            <img src="./assets/nav-logo.png" alt="" class="w-30 h-auto">
            <ul class="flex gap-5 items-center justify-self-center">
                <li><a href="">Products</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact us</a></li>
            </ul>
            <div class="flex gap-5 items-center justify-self-end">
                <span class="cursor-pointer"><i class="fa-solid fa-magnifying-glass"></i></span>
                <span class="cursor-pointer"><i class="fa-solid fa-cart-shopping"></i></span>
                <button class="border border-green-500 px-5 py-0.5 rounded cursor-pointer">Login</button>
                <button class="bg-[#179800] text-white px-5 py-1 rounded cursor-pointer">Register</button>
            </div>
        </nav>
        <!-- Nav-Bar ends -->

        <!-- Hero Section starts -->
        <section class="text-center py-20 bg-linear-to-t from-[#EFEBE3] to-white space-y-6">
            <h2 class="text-5xl font-semibold">Freshness <span class="text-[#179800]">You Can<br>Count</span> On, Prices You'll Love!</h2>
            <p>Shop your daily essentials at unbeatable prices. From fresh produce to pantry<br>staples, we've got you covered every day!</p>
            <img src="./assets/Hero Section 1.png" alt="" class="mx-auto w-190" h-auto>
        </section>
        <!-- Hero Section ends -->
    </header>

</body>

</html>
